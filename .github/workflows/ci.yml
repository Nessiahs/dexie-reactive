name: ci

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    quality-gate:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout repository
              uses: Nessiahs/nuxt-keycloak-oidc/.github/actions/checkout@v0.9.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 🧭 Detect changelog commit
              id: changelog_commit
              uses: ./.github/actions/changelog-commit-guard

            - name: 🟢 Setup Node.js
              if: steps.changelog_commit.outputs.is_changelog_pull_request != 'true'
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: 📦 Install dependencies
              if: steps.changelog_commit.outputs.is_changelog_pull_request != 'true'
              run: npm ci --include=optional

            - name: 🔍 Run ESLint
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              run: npm run lint

            - name: 🎨 Check Prettier formatting
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              run: npm run format:check

            - name: 🔎 Run TypeScript typecheck
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              run: npm run typecheck

            - name: 🧪 Run tests with coverage
              if: steps.changelog_commit.outputs.is_changelog_pull_request != 'true'
              run: npm run test:coverage

            - name: 🎭 Cache Playwright browsers
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              uses: actions/cache@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: 🎭 Install Playwright browsers
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              run: npx playwright install chromium

            - name: 🌐 Run browser integration test
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              run: npm run test:browser

            - name: 🏗️ Build package
              if: steps.changelog_commit.outputs.is_changelog_commit != 'true'
              run: npm run build

            - name: 📊 Upload coverage to Codacy
              if: steps.changelog_commit.outputs.is_changelog_pull_request != 'true'
              uses: codacy/codacy-coverage-reporter-action@v1.3.0
              with:
                  project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
                  coverage-reports: ./coverage/lcov.info
              env:
                  CODACY_COMMIT: ${{ github.sha }}
                  CODACY_BRANCH: ${{ github.ref_name }}

name: Feature request
description: Suggest an improvement or new capability for dexie-reactive
title: 'feat: '
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Thank you for suggesting an improvement.

              Please describe the problem first. This helps keep the public API small and focused.

    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What problem would this feature solve?
          placeholder: Describe the concrete use case or limitation.
      validations:
          required: true

    - type: textarea
      id: proposed-solution
      attributes:
          label: Proposed solution
          description: What behavior or API would you like to see?
          placeholder: Describe your proposed solution.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: What alternatives or workarounds have you considered?
      validations:
          required: false

    - type: dropdown
      id: impact
      attributes:
          label: Impact
          description: Which area would this change affect?
          options:
              - Public API
              - Internal lifecycle behavior
              - SSR / Nuxt behavior
              - Browser integration
              - Documentation
              - Tooling / CI
              - Other
      validations:
          required: true

    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: Add examples, links, screenshots, or related context.
      validations:
          required: false

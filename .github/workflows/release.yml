name: release

on:
    workflow_run:
        workflows: ['ci']
        types:
            - completed
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    changelog:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        outputs:
            version: ${{ steps.changelog.outputs.version }}

        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.event == 'push' &&
            !startsWith(github.event.workflow_run.head_commit.message, 'docs(changelog):')

        steps:
            - name: 📥 Checkout repository
              uses: Nessiahs/nuxt-keycloak-oidc/.github/actions/checkout@v0.9.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 📝 Generate changelog
              id: changelog
              uses: Nessiahs/nuxt-keycloak-oidc/.github/actions/changelog@v0.9.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: 💾 Commit changelog
              if: steps.changelog.outputs.version != ''
              uses: Nessiahs/nuxt-keycloak-oidc/.github/actions/commit@v0.9.0
              env:
                  VERSION: ${{ steps.changelog.outputs.version }}
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  message: 'docs(changelog): update changelog'
                  branch: docs/changelog-${{ env.VERSION }}
                  path: 'CHANGELOG.md'

            - name: 🔀 Create changelog pull request
              if: steps.changelog.outputs.version != ''
              id: pr
              env:
                  VERSION: ${{ steps.changelog.outputs.version }}
              uses: Nessiahs/nuxt-keycloak-oidc/.github/actions/pr@v0.9.0
              with:
                  base: 'main'
                  head: docs/changelog-${{ steps.changelog.outputs.version }}
                  title: 'docs(changelog): update changelog for version ${{ steps.changelog.outputs.version }}'
                  token: ${{ secrets.PAT_TOKEN }}

            - name: ⏳ Wait for changelog pull request checks
              if: steps.changelog.outputs.version != '' && steps.pr.outputs.number != ''
              timeout-minutes: 10
              env:
                  GH_TOKEN: ${{ secrets.PAT_TOKEN }}
                  PR_NUMBER: ${{ steps.pr.outputs.number }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail

                  max_attempts=100
                  sleep_seconds=5

                  for attempt in $(seq 1 "$max_attempts"); do
                    set +e
                    checks_count="$(gh pr checks "$PR_NUMBER" \
                      --repo "$REPOSITORY" \
                      --json name \
                      --jq 'length' 2>/dev/null)"
                    checks_status=$?
                    set -e

                    if [[ "$checks_status" -eq 0 && "$checks_count" -gt 0 ]]; then
                      #
                      # Once checks exist, let gh own the final pass/fail
                      # decision. Pending checks are expected at this point.
                      #
                      # Missing checks are best-effort for changelog PRs, but
                      # reported failures should still block publishing.
                      #
                      gh pr checks "$PR_NUMBER" \
                        --repo "$REPOSITORY" \
                        --watch \
                        --fail-fast
                      exit 0
                    fi

                    if [[ "$checks_status" -ne 0 ]]; then
                      set +e
                      checks_output="$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" 2>&1)"
                      output_status=$?
                      set -e

                      if [[ "$checks_output" != *"no checks reported"* ]]; then
                        echo "$checks_output"
                        exit "$output_status"
                      fi
                    fi

                    echo "Waiting for changelog PR checks ($attempt/$max_attempts)..."
                    sleep "$sleep_seconds"
                  done

                  echo "::warning::No checks were reported for changelog PR #$PR_NUMBER before timeout; continuing release."

            - name: ✅ Merge changelog pull request
              if: steps.changelog.outputs.version != '' && steps.pr.outputs.number != ''
              uses: Nessiahs/nuxt-keycloak-oidc/.github/actions/merge@v0.9.0
              with:
                  token: ${{ secrets.PAT_TOKEN }}
                  number: ${{ steps.pr.outputs.number }}

    publish:
        runs-on: ubuntu-latest
        needs: changelog
        if: needs.changelog.outputs.version != ''
        permissions:
            contents: read
            id-token: write

        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v6
              with:
                  ref: main

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22.14.0'
                  registry-url: 'https://registry.npmjs.org'
                  cache: npm

            - name: ⬆️ Update npm
              run: npm install -g npm@^11.5.1

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🏷️ Set package version from release
              run: npm pkg set version="${{ needs.changelog.outputs.version }}"

            - name: 🏗️ Build package
              run: npm run build

            - name: 🚀 Publish to npm
              run: npm publish

            - name: 📦 Upload release artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-artifact

                  path: |
                      dist
                      package.json
                      CHANGELOG.md
